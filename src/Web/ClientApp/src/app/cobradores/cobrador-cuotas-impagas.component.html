@if (!vm()) {
  <span aria-busy="true">Cargando&hellip;</span>
} @else {
  <h4>{{ subtitle }}</h4>
  <app-data-table
    [columns]="columns"
    [data]="vm()!.cuotas"
    [options]="tableOptions"
    [footer]="true"
    rowId="socioId" />
  <div class="volver">
    <button type="button" class="secondary" (click)="goToCobradores()">Volver</button>
  </div>
}
