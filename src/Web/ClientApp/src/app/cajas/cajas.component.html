<div class="page-header">
  <hgroup>
    <h1>{{ 'cajas.titulo' | translate }}</h1>
    <p>{{ 'cajas.descripcion' | translate }}</p>
  </hgroup>
  <div class="toolbar">
    @if (!existeCajaPrincipal() && puedeAdministrar) {
      <button type="button" class="outline" style="width: auto;" [attr.title]="'cajas.crearPrincipal' | translate" (click)="crearCajaPrincipal()">
        {{ 'cajas.cajaPrincipal' | translate }} <lucide-icon name="plus" [size]="18" [strokeWidth]="2" />
      </button>
    }
  </div>
</div>

<app-data-table
  [columns]="columns"
  [data]="cajas()"
  [actions]="actions"
  [exportTitle]="'cajas.titulo' | translate"
  (action)="onAction($event)" />
