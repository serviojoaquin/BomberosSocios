<dialog #dialog>
  <article>
    <header>
      <h3>Seleccione el año</h3>
      <button rel="prev" aria-label="Cerrar" (click)="close()"></button>
    </header>
    <div class="year-buttons">
      @for (year of years(); track year) {
        <button type="button" class="outline" (click)="choose(year)">{{ year }}</button>
      }
    </div>
    @if (showCheck()) {
      <label class="checkbox-inline">
        <input type="checkbox" [(ngModel)]="checkValue" />
        {{ checkText() }}
      </label>
    }
    @if (showDateRangePicker()) {
      <div class="form-grid">
        <label>
          Fecha de cobro (inicio)
          <input type="date" [(ngModel)]="startDate" [min]="minDate" [max]="maxDate" />
        </label>
        <label>
          Fecha de cobro (fin)
          <input type="date" [(ngModel)]="endDate" [min]="minDate" [max]="maxDate" />
        </label>
      </div>
    }
  </article>
</dialog>
