<hgroup>
  <h1>Users</h1>
  <p>Registered users and their roles. Changes apply the next time the user logs in.</p>
</hgroup>

<app-data-table
  [columns]="columns"
  [data]="users()"
  [actions]="actions"
  exportTitle="Users"
  (action)="onAction($event)" />

<dialog #editDialog>
  <article>
    <header>
      <h3>Roles for {{ editor.userName }}</h3>
      <button rel="prev" aria-label="Close" (click)="closeEditDialog()"></button>
    </header>
    <fieldset>
      @for (role of availableRoles(); track role) {
        <label>
          <input type="checkbox" [checked]="hasRole(role)" (change)="toggleRole(role, $any($event.target).checked)" />
          {{ role }}
        </label>
      }
    </fieldset>
    @if (editorError()) {
      <small class="error">{{ editorError() }}</small>
    }
    <footer>
      <button class="secondary" (click)="closeEditDialog()">Cancel</button>
      <button (click)="save()">Update</button>
    </footer>
  </article>
</dialog>
