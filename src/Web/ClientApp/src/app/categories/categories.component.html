<hgroup>
  <h1>Categories</h1>
  <p>Membership categories and their monthly amount.</p>
</hgroup>

<div class="todo-panel-header">
  <h2>All categories</h2>
  @if (canCreate) {
    <button class="icon-btn" aria-label="New category" (click)="showNewDialog()"><lucide-icon name="plus" [size]="20" [strokeWidth]="2" /></button>
  }
</div>

<app-data-table
  [columns]="columns"
  [data]="categories()"
  [actions]="actions"
  exportTitle="Categories"
  (action)="onAction($event)" />

<dialog #editDialog>
  <article>
    <header>
      <h3>{{ editor.id ? 'Edit Category' : 'New Category' }}</h3>
      <button rel="prev" aria-label="Close" (click)="closeEditDialog()"></button>
    </header>
    <label for="description">Description</label>
    <input type="text" id="description" placeholder="Category description&hellip;" [(ngModel)]="editor.description"
      [attr.aria-invalid]="editorError() ? 'true' : null"
      (keyup.enter)="save()" maxlength="200" />
    @if (editorError()) {
      <small>{{ editorError() }}</small>
    }
    <label for="amount">Amount</label>
    <input type="number" id="amount" min="0" step="0.01" [(ngModel)]="editor.amount" (keyup.enter)="save()" />
    <footer>
      <button class="secondary" (click)="closeEditDialog()">Cancel</button>
      <button (click)="save()">{{ editor.id ? 'Update' : 'Create' }}</button>
    </footer>
  </article>
</dialog>

<dialog #deleteDialog>
  <article>
    <header>
      <h3>Delete "{{ selected()?.description }}"?</h3>
      <button rel="prev" aria-label="Close" (click)="closeDeleteDialog()"></button>
    </header>
    <p>This action cannot be undone.</p>
    <footer>
      <button class="secondary" (click)="closeDeleteDialog()">Cancel</button>
      <button class="danger" (click)="deleteConfirmed()">Delete</button>
    </footer>
  </article>
</dialog>
