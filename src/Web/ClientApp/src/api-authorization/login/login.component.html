<article>
  <h2>{{ 'auth.logIn' | translate }}</h2>
  <form (ngSubmit)="login()" #loginForm="ngForm">
    <label for="email">{{ 'auth.email' | translate }}</label>
    <input type="email" id="email" name="email" [(ngModel)]="email"
      [attr.aria-invalid]="invalid ? true : null"
      aria-describedby="login-error"
      autocomplete="username"
      (ngModelChange)="invalid = false" />
    <label for="password">{{ 'auth.password' | translate }}</label>
    <input type="password" id="password" name="password" [(ngModel)]="password"
      [attr.aria-invalid]="invalid ? true : null"
      aria-describedby="login-error"
      autocomplete="current-password"
      (ngModelChange)="invalid = false" />
    @if (invalid) {
      <small id="login-error">{{ 'auth.invalid' | translate }}</small>
    }
    <button type="submit">{{ 'auth.logIn' | translate }}</button>
    <p style="margin-top: 1rem">{{ 'auth.noAccount' | translate }} <a [routerLink]="['/register']">{{ 'auth.register' | translate }}</a></p>
  </form>
</article>
